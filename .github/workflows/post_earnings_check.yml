# Post-earnings Results Check
#
# Runs weekday evenings to catch beat/miss for names that reported today.
# Checks both today's events (BMO reported this morning, AMC just now) and
# yesterday's events (in case AMC actuals came in overnight).
#
# 22:37 UTC ≈ 5:37 PM ET (EST) / 6:37 PM ET (EDT). Picked to fall after
# most BMO/AMC reports are posted; off-peak minute to dodge top-of-hour skips.

name: Post-Earnings Results Check

on:
  schedule:
    - cron: "37 22 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date (YYYY-MM-DD). Defaults to today."
        required: false
        type: string

# Serialize with daily_earnings_check and reconcile_calendar — all three
# read/write the earnings-db artifact.
concurrency:
  group: earnings-db-writer
  cancel-in-progress: false

jobs:
  check-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout earnings-agent
        uses: actions/checkout@v5

      - name: Checkout Coverage Manager exports
        uses: actions/checkout@v5
        with:
          repository: jroypeterson/Coverage-Manager
          path: coverage-manager
          sparse-checkout: |
            exports
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Deterministic restore: newest unexpired `earnings-db` artifact on main,
      # selected by created_at through the artifacts API and downloaded by id.
      #
      # Replaced dawidd6/action-download-artifact on 2026-09-08. That action chose
      # by ENUMERATING RUNS, and measured over the twelve most recent runs of the
      # four workflows that restore this database, TWO restored a stale artifact --
      # reconcile_calendar run 34259752925 restored a 2026-09-05 snapshot, skipping
      # one from 2026-09-08 15:06, then re-uploaded it as the newest earnings-db.
      # Content lost: events 2987 -> 2980, eps_actual 1744 -> 1740, kv_store 70 -> 69.
      # The script carries the full measurement and the failure contract; the
      # rollback guard below remains the content backstop.
      #
      # The script's own retry/verify replaces the previous restore+retry step pair:
      # it retries the listing and the download, verifies the SQLite file before it
      # overwrites the working copy, and exits non-zero rather than leaving a
      # half-restored database behind. No continue-on-error -- a restore that cannot
      # complete must stop the run, not start a fresh-DB one.
      - name: Restore earnings database
        id: restore_db
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci_restore_db_artifact.sh

      - name: Abort if DB artifact missing post-bootstrap
        if: vars.EA_DB_BOOTSTRAPPED == 'true' && hashFiles('earnings_events.db') == ''
        env:
          WEBHOOK_STATUS: ${{ secrets.SLACK_WEBHOOK_STATUS }}
          WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WEBHOOK="${WEBHOOK_STATUS:-$WEBHOOK_EARNINGS}"
          if [ -n "$WEBHOOK" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              --data "{\"text\":\":rotating_light: *earnings-db artifact missing* — aborting fresh-DB run. Locks, Slack threads, unseen counters, kv_store would all be lost. <${RUN_URL}|run details>\"}" \
              "$WEBHOOK"
          fi
          exit 1

      # Rollback guard. The abort step above proves the DB is PRESENT; this one proves it
      # is not a rolled-back snapshot. Added 2026-08-27 after the artifact restore spent
      # three days silently returning a 2026-07-27 database that every run then wrote to
      # and re-uploaded as newest, taking 2026Q2 from 958 eps_actual to 256 while CI
      # stayed green. See scripts/ci_db_rollback_guard.sh for the measurements.
      - name: Guard against a rolled-back DB artifact
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_STATUS: ${{ secrets.SLACK_WEBHOOK_STATUS }}
          WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
        run: bash scripts/ci_db_rollback_guard.sh

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
        continue-on-error: true  # calendar updates are best-effort

      # Ensure the events table has entries with estimates for today's date
      # so check-results can compute beat/miss deltas against our consensus.
      - name: Populate events from Finnhub
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          COVERAGE_MANAGER_PATH: ${{ github.workspace }}/coverage-manager
        run: python main.py --populate-db-only --no-ticktick

      - name: Check today's results
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CREDENTIALS_PATH: credentials.json
          COVERAGE_MANAGER_PATH: ${{ github.workspace }}/coverage-manager
          SLACK_WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          TICKTICK_ACCESS_TOKEN: ${{ secrets.TICKTICK_ACCESS_TOKEN }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python main.py --check-results --date "${{ inputs.date }}"
          else
            python main.py --check-results
          fi

      # Also sweep yesterday to catch AMC reports whose actuals posted overnight.
      - name: Check yesterday's results (AMC overnight catch-up)
        if: inputs.date == ''
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CREDENTIALS_PATH: credentials.json
          COVERAGE_MANAGER_PATH: ${{ github.workspace }}/coverage-manager
          SLACK_WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          TICKTICK_ACCESS_TOKEN: ${{ secrets.TICKTICK_ACCESS_TOKEN }}
        run: |
          YESTERDAY=$(date -u -d 'yesterday' +%Y-%m-%d)
          python main.py --check-results --date "$YESTERDAY"

      # EDGAR backstop: after the Finnhub sweeps, flag any Tier 1/2 name that
      # filed an 8-K Item 2.02 (i.e. reported) but for which Finnhub still has
      # no actuals — the FIVE-class silent miss. Alert-only, dedup'd per
      # ticker+quarter. This IS the never-miss layer, so a failure must be
      # loud: `_run_safeguard` posts a degraded-health alert to #status-reports
      # and re-raises (NOT continue-on-error).
      - name: EDGAR missed-results backstop
        if: inputs.date == ''
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          COVERAGE_MANAGER_PATH: ${{ github.workspace }}/coverage-manager
          SLACK_WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          SLACK_WEBHOOK_STATUS: ${{ secrets.SLACK_WEBHOOK_STATUS }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python main.py --check-missed-results --no-heartbeat

      # Only main-branch runs upload — otherwise a feature-branch test
      # could leave a tainted artifact for the next mainline restore.
      - name: Save earnings database
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: earnings-db
          path: earnings_events.db
          retention-days: 90
          overwrite: true

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK_EARNINGS" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              --data "{\"text\":\":rotating_light: *Post-Earnings Results Check* failed — <${RUN_URL}|run details>\"}" \
              "$SLACK_WEBHOOK_EARNINGS"
          fi

      # Out-of-band backup: also email, in case Slack itself is the failure.
      # Inline (no repo-checkout dependency).
      - name: Email backup on failure
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: jroypeterson+alerts@gmail.com
          ALERT_SUBJECT: "[ClaudeFin] earnings_agent — Post-Earnings Results Check failed"
          ALERT_BODY: "The Post-Earnings Results Check failed (results/missed-results/EDGAR alerting may be down). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          addr = os.environ.get("GMAIL_ADDRESS", "").strip()
          pw = os.environ.get("GMAIL_APP_PASSWORD", "").strip()
          to = os.environ.get("ALERT_EMAIL_TO", "jroypeterson+alerts@gmail.com").strip()
          if not addr or not pw:
              print("email backup: GMAIL creds unset - skipping"); raise SystemExit(0)
          msg = MIMEText(os.environ.get("ALERT_BODY", "") or os.environ.get("ALERT_SUBJECT", ""), "plain")
          msg["Subject"] = os.environ.get("ALERT_SUBJECT", "[ClaudeFin] earnings_agent — alert")
          msg["From"] = addr; msg["To"] = to
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as s:
              s.login(addr, pw); s.send_message(msg)
          print(f"email backup: sent to {to}")
          PY

      - name: Cleanup credentials
        if: always()
        run: rm -f credentials.json
