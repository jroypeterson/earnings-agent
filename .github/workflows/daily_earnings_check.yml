# .github/workflows/daily_earnings_check.yml
#
# Runs the earnings agent once daily at 11:00 UTC:
#   - 6:00 AM ET during EST (November-March)
#   - 7:00 AM ET during EDT (March-November)
# Also supports manual triggers from the GitHub Actions UI.

name: Daily Earnings Check

on:
  schedule:
    # 11:13 UTC ≈ 6 AM EST / 7 AM EDT  (morning full sync)
    # Off-peak minute deliberately — top-of-hour crons get delayed/skipped
    # under GitHub Actions load.
    - cron: "13 11 * * *"
    # 19:23 UTC ≈ 2 PM EST / 3 PM EDT  (weekday afternoon redundancy).
    # Catches new events and date moves Finnhub published mid-day, before
    # the 22:00 post-earnings-check run.
    - cron: "23 19 * * 1-5"
  workflow_dispatch: # Manual trigger
    inputs:
      restore_artifact_id:
        description: >-
          Recovery lever. Pin the DB restore to one specific earnings-db artifact id
          instead of whatever the downloader picks. Use after a rollback, then leave
          it blank. Find candidates with:
          gh api "repos/jroypeterson/earnings-agent/actions/artifacts?name=earnings-db"
        required: false
        default: ""


# Serialize with reconcile_calendar and post_earnings_check — all three
# read/write the earnings-db artifact.
concurrency:
  group: earnings-db-writer
  cancel-in-progress: false

# contents:write needed for the exports/upcoming_events.json commit-back
# step (publishes the calendar JSON for sa-monitor Phase 2 enrichment).
permissions:
  contents: write
  # The rollback guard lists and downloads earnings-db artifacts via gh api. The repo
  # default is read-all, but an explicit permissions block replaces it wholesale, so
  # actions:read has to be named here or the guard cannot see the artifacts.
  actions: read

jobs:
  check-earnings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout earnings-agent
        uses: actions/checkout@v5
        with:
          # Pin the checkout to the BRANCH REF, not the default (github.sha).
          # A GitHub re-run of an old workflow run reuses that run's sha, so the
          # default checks out OLD CODE, which then writes the shared earnings-db
          # artifact and uploads it with a NEWEST created_at -- the rollback guard
          # passes it because accumulated actuals are unchanged, and the next run
          # restores a database written by code that predates the current schema.
          # An explicit ref takes that branch's tip at checkout time instead.
          #
          # `github.ref`, deliberately NOT a literal `main`: these workflows are
          # schedule + workflow_dispatch, so on every normal trigger this is
          # already main's tip and the change is a no-op -- but pinning the
          # literal would silently stop a branch dispatch from testing its own
          # branch. Same cost, one fewer path removed.
          ref: ${{ github.ref }}

      # Coverage Manager is public — clone its exports so the agent gets
      # tier and sector data instead of falling back to legacy mode.
      - name: Checkout Coverage Manager exports
        uses: actions/checkout@v5
        with:
          repository: jroypeterson/Coverage-Manager
          path: coverage-manager
          sparse-checkout: |
            exports
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Deterministic restore: newest unexpired `earnings-db` artifact on main,
      # selected by created_at through the artifacts API and downloaded by id.
      #
      # Replaced dawidd6/action-download-artifact on 2026-09-08. That action chose
      # by ENUMERATING RUNS, and measured over the twelve most recent runs of the
      # four workflows that restore this database, TWO restored a stale artifact --
      # reconcile_calendar run 34259752925 restored a 2026-09-05 snapshot, skipping
      # one from 2026-09-08 15:06, then re-uploaded it as the newest earnings-db.
      # Content lost: events 2987 -> 2980, eps_actual 1744 -> 1740, kv_store 70 -> 69.
      # The script carries the full measurement and the failure contract; the
      # rollback guard below remains the content backstop.
      #
      # The script's own retry/verify replaces the previous restore+retry step pair:
      # it retries the listing and the download, verifies the SQLite file before it
      # overwrites the working copy, and exits non-zero rather than leaving a
      # half-restored database behind. No continue-on-error -- a restore that cannot
      # complete must stop the run, not start a fresh-DB one.
      - name: Restore earnings database
        id: restore_db
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci_restore_db_artifact.sh

      - name: Abort if DB artifact missing post-bootstrap
        if: vars.EA_DB_BOOTSTRAPPED == 'true' && hashFiles('earnings_events.db') == ''
        env:
          WEBHOOK_STATUS: ${{ secrets.SLACK_WEBHOOK_STATUS }}
          WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WEBHOOK="${WEBHOOK_STATUS:-$WEBHOOK_EARNINGS}"
          if [ -n "$WEBHOOK" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              --data "{\"text\":\":rotating_light: *earnings-db artifact missing* — aborting fresh-DB run. Locks, Slack threads, unseen counters, kv_store would all be lost. <${RUN_URL}|run details>\"}" \
              "$WEBHOOK"
          fi
          exit 1

      # Rollback guard. The abort step above proves the DB is PRESENT; this one proves it
      # is not a rolled-back snapshot. Added 2026-08-27 after the artifact restore spent
      # three days silently returning a 2026-07-27 database that every run then wrote to
      # and re-uploaded as newest, taking 2026Q2 from 958 eps_actual to 256 while CI
      # stayed green. See scripts/ci_db_rollback_guard.sh for the measurements.
      - name: Guard against a rolled-back DB artifact
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_STATUS: ${{ secrets.SLACK_WEBHOOK_STATUS }}
          WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          EA_DB_RESTORE_ARTIFACT_ID: ${{ inputs.restore_artifact_id }}
        run: bash scripts/ci_db_rollback_guard.sh

      # Write the Google service account credentials from a GitHub secret
      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run earnings agent
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CREDENTIALS_PATH: credentials.json
          COVERAGE_MANAGER_PATH: ${{ github.workspace }}/coverage-manager
          TICKTICK_ACCESS_TOKEN: ${{ secrets.TICKTICK_ACCESS_TOKEN }}
          SLACK_WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          SLACK_WEBHOOK_STATUS: ${{ secrets.SLACK_WEBHOOK_STATUS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_STATUS_CHANNEL_ID: ${{ secrets.SLACK_STATUS_CHANNEL_ID }}
          TICKERS: ${{ vars.TICKERS }}  # Legacy fallback
        run: python main.py

      # Description drift: the daily sync's existing-event fast path
      # only triggers calendar updates on date or hour changes, so
      # description-only changes (e.g., newly-populated call_datetime_utc
      # via yfinance Ticker.info) won't propagate without this step.
      # Idempotent — no-op when descriptions already match.
      - name: Refresh calendar descriptions
        continue-on-error: true
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CREDENTIALS_PATH: credentials.json
        run: python main.py --refresh-descriptions

      # yfinance cross-check. Alert-only: Finnhub has already been applied
      # above; this surfaces two-source disagreements to prompt IR
      # verification. Per-ticker yfinance flakiness is swallowed inside the
      # script (yf_missing counter), so only a SYSTEMIC failure crashes here —
      # and that must be loud, not silent (it's the date-correctness layer).
      # `_run_safeguard` posts a degraded-health alert to #status-reports and
      # re-raises, so this step is intentionally NOT continue-on-error.
      - name: Cross-check Finnhub vs yfinance (Tier 1/2)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          COVERAGE_MANAGER_PATH: ${{ github.workspace }}/coverage-manager
          SLACK_WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          SLACK_WEBHOOK_STATUS: ${{ secrets.SLACK_WEBHOOK_STATUS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_STATUS_CHANNEL_ID: ${{ secrets.SLACK_STATUS_CHANNEL_ID }}
          # Calendar credentials needed for EDGAR auto-correction:
          # when SEC contradicts the stored date, the agent moves the
          # calendar event in addition to updating DB.
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CREDENTIALS_PATH: credentials.json
          # Web-search resolver (web_resolver.py): finds the company's own
          # announced date and auto-locks high-confidence matches before
          # asking the operator. Unset -> resolver skipped, old behavior.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --cross-check

      # Scan Gmail for IR-alert pre-announcements and auto-confirm
      # estimated Tier 1/2 events. Materializes the GMAIL_TOKEN_JSON +
      # GMAIL_CLIENT_CREDENTIALS_JSON secrets to disk so gmail_client
      # picks them up via its default file paths. No-ops cleanly when
      # secrets aren't set (gmail_client raises GmailError, caught and
      # logged at INFO). Never fails the workflow.
      - name: Check IR-alert emails
        continue-on-error: true
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_CLIENT_CREDENTIALS_JSON: ${{ secrets.GMAIL_CLIENT_CREDENTIALS_JSON }}
          SLACK_WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
        run: |
          if [ -z "$GMAIL_TOKEN_JSON" ]; then
            echo "GMAIL_TOKEN_JSON secret not set — skipping IR-email scan"
            exit 0
          fi
          printf '%s' "$GMAIL_TOKEN_JSON" > gmail_token.json
          printf '%s' "$GMAIL_CLIENT_CREDENTIALS_JSON" > gmail_client_credentials.json
          python main.py --check-ir-emails
          # Wipe the credentials from the runner FS — the artifact
          # upload step later only includes earnings_events.db, but
          # explicit cleanup avoids any future regression.
          rm -f gmail_token.json gmail_client_credentials.json

      # Poll Slack threads for replies on open questions and apply any
      # commands to DB state. No-op when SLACK_BOT_TOKEN/SLACK_CHANNEL_ID
      # are unset. Slack replies drive manual locks/corrections, so failures
      # must be loud: --check-replies is wrapped in _run_safeguard (posts a
      # degraded-health alert + re-raises), hence NOT continue-on-error.
      - name: Check Slack replies on open questions
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_STATUS_CHANNEL_ID: ${{ secrets.SLACK_STATUS_CHANNEL_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CREDENTIALS_PATH: credentials.json
        run: python main.py --check-replies

      # Pre-print ANNUAL consensus snapshot (board #298 Phase A). FMP keeps no
      # estimate history, so the consensus as it stood BEFORE a release exists
      # only if it is captured while the event is still ahead; the guidance
      # square compares against these rows, never a live post-print fetch.
      # Writes consensus_snapshot rows only -- nothing in the Slack output moves.
      # ~400 tickers x 1 call at the 4/s pacer on the heaviest run.
      #
      # ORDER (Codex round 3): after EVERY step that corrects event dates --
      # the sync, the cross-check (EDGAR auto-correction), the IR-email
      # confirmations and the Slack replies (operator locks) -- so a snapshot
      # is never taken against an uncorrected date or window. It reads only
      # the events table and FMP; nothing it depends on runs later. Before the
      # DB save, so on a clean run its rows ride the earnings-db artifact.
      #
      # A FEATURE, not a date safeguard: continue-on-error so it can never fail
      # the critical sync. Its failure is NOT silent, though -- see the two
      # alert steps below. The script also exits non-zero when EVERY fetch
      # failed (bad key / plan change), and posts a #status-reports summary
      # when only some did.
      # The snapshot rows ALSO persist on their own (Codex round 3), because
      # the earnings-db save at the end of the job is skipped when any later
      # step fails. The newest `consensus-snapshots` artifact is restored here
      # (same newest-by-created_at + verify-before-overwrite script as the DB),
      # merged into the DB by the snapshot step BEFORE it snapshots, and the
      # whole table is exported and uploaded again after -- so the newest
      # artifact is always cumulative, and restoring just it recovers every
      # run whose DB save was lost. It never touches the earnings-db artifact.
      - name: Restore consensus snapshots side artifact
        id: restore_snapshots
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          EA_DB_ARTIFACT_NAME: consensus-snapshots
          EA_DB_PATH: consensus_snapshots.db
          EA_DB_VERIFY_TABLE: consensus_snapshot
          # Codex round 10, C1: the script's mandatory-artifact refusal was
          # gated on this flag and NOTHING set it, so the guard was inert in
          # production while its test injected the value by hand.
          #
          # ⛑ It must NOT be a literal "true". Measured 2026-09-23: the
          # consensus-snapshots artifact has total_count = 0 -- it has never
          # been uploaded, because this branch is unmerged. A literal would
          # make the first post-merge run exit 1 here, which sets this step's
          # `outcome` to failure, which skips "Save consensus snapshots side
          # artifact" below (it is gated on outcome == 'success'), so the
          # artifact could NEVER be created and the alert would fire twice a
          # day forever with no manual way out. The guard would become the
          # outage.
          #
          # Same bootstrap shape as vars.EA_DB_BOOTSTRAPPED. An unset repo
          # variable renders as the empty string, which fails the script's
          # `= "true"` test and takes the bootstrap exit-0 path. The persist
          # step below announces the flip until it is set, so the inert window
          # cannot be forgotten the way the earnings-db one was (~85 days).
          EA_DB_REQUIRE_ARTIFACT: ${{ vars.EA_CONSENSUS_BOOTSTRAPPED }}
        run: bash scripts/ci_restore_db_artifact.sh

      - name: Snapshot pre-print annual consensus (FMP)
        id: snapshot_consensus
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        # Hard ceiling in addition to the in-code 15-min budget (Codex round 1):
        # this step runs BEFORE 'Save earnings database', so it must never be
        # able to hold the job open past the point where that save is lost.
        timeout-minutes: 20
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SLACK_WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          SLACK_WEBHOOK_STATUS: ${{ secrets.SLACK_WEBHOOK_STATUS }}
          CONSENSUS_SNAPSHOT_FILE: consensus_snapshots.db
        run: python main.py --snapshot-consensus

      # Uploaded whatever fails later (always()), but only when:
      # - the snapshot step's EXPORT completed this run (it writes
      #   `exported=true` to GITHUB_OUTPUT). Not the step outcome: a step
      #   killed at timeout-minutes reports `failure` (Codex r8) and would
      #   republish the untouched restored file.
      # - the restore SUCCEEDED (a clean bootstrap counts): an export built
      #   without the previous artifact merged in would become the newest,
      #   NON-cumulative copy and hide the rows only the old one holds.
      # Its own name, no overwrite: nothing here can delete the earnings-db
      # artifact or an earlier snapshot copy.
      - name: Save consensus snapshots side artifact
        id: persist_snapshots
        if: always() && github.ref == 'refs/heads/main' && steps.restore_snapshots.outcome == 'success' && steps.snapshot_consensus.outputs.exported == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: consensus-snapshots
          path: consensus_snapshots.db
          retention-days: 90
          if-no-files-found: error

      # ⛑ The bootstrap flip must ANNOUNCE ITSELF. A repo variable a human has
      # to remember to set is "never set in production" with extra steps --
      # which is exactly what C1 filed as Critical. The precedent here is an
      # ~85-day lag: the oldest expired earnings-db artifact is 2026-02-09 and
      # EA_DB_BOOTSTRAPPED was not set until 2026-05-04. Until the variable is
      # set, the mandatory-artifact guard above is inert; this line says so on
      # every successful upload instead of trusting memory.
      # Recovery from an EARLY flip (set before an artifact exists) is one
      # command: gh variable delete EA_CONSENSUS_BOOTSTRAPPED.
      - name: Announce consensus bootstrap until the repo variable is set
        if: always() && steps.persist_snapshots.outcome == 'success' && vars.EA_CONSENSUS_BOOTSTRAPPED == ''
        continue-on-error: true
        timeout-minutes: 2
        env:
          SLACK_WEBHOOK_STATUS: ${{ secrets.SLACK_WEBHOOK_STATUS }}
          SLACK_WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WEBHOOK="${SLACK_WEBHOOK_STATUS:-$SLACK_WEBHOOK_EARNINGS}"
          if [ -n "$WEBHOOK" ]; then
            TEXT=":package: consensus-snapshots is bootstrapped (artifact uploaded). Set repo variable \`EA_CONSENSUS_BOOTSTRAPPED=true\` to arm the mandatory-artifact guard -- until then a vanished artifact restores as a silent fresh start. $RUN_URL"
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "$(printf '{"text":%s}' "$(printf '%s' "$TEXT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")" \
              "$WEBHOOK" || true
          fi

      # ⚠ Why these read `steps.snapshot_consensus.outcome` and not `failure()`:
      # continue-on-error turns a failed step's CONCLUSION into success, and
      # failure() reads conclusions -- so a bare `if: failure()` here can never
      # fire for this step. `outcome` is the pre-continue-on-error result.
      # Both alerts are themselves continue-on-error: a failed curl must not
      # skip the "Save earnings database" step below and lose this run's DB.
      - name: Notify Slack on consensus snapshot failure
        if: always() && ((steps.snapshot_consensus.outcome != 'success' && steps.snapshot_consensus.outcome != 'skipped') || steps.restore_snapshots.outcome == 'failure' || steps.persist_snapshots.outcome == 'failure')
        continue-on-error: true
        timeout-minutes: 2
        env:
          SLACK_WEBHOOK_STATUS: ${{ secrets.SLACK_WEBHOOK_STATUS }}
          SLACK_WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WEBHOOK="${SLACK_WEBHOOK_STATUS:-$SLACK_WEBHOOK_EARNINGS}"
          if [ -n "$WEBHOOK" ]; then
            curl -sS --connect-timeout 10 --max-time 20 -X POST -H 'Content-Type: application/json' \
              --data "{\"text\":\":warning: *Consensus snapshot* step failed, or its side artifact was not restored/saved — pre-print FY consensus may NOT be captured/persisted this run (the daily sync itself is fine). <${RUN_URL}|run details>\"}" \
              "$WEBHOOK"
          fi

      # Out-of-band backup, inline (runner python3 + stdlib) per the workflow
      # convention -- never a call into scripts/.
      - name: Email backup on consensus snapshot failure
        if: always() && ((steps.snapshot_consensus.outcome != 'success' && steps.snapshot_consensus.outcome != 'skipped') || steps.restore_snapshots.outcome == 'failure' || steps.persist_snapshots.outcome == 'failure')
        continue-on-error: true
        timeout-minutes: 2
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: jroypeterson+alerts@gmail.com
          ALERT_SUBJECT: "[ClaudeFin] earnings_agent — consensus snapshot step or its side artifact failed"
          ALERT_BODY: "The pre-print consensus snapshot step failed in Daily Earnings Check (the sync itself succeeded). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          addr = os.environ.get("GMAIL_ADDRESS", "").strip()
          pw = os.environ.get("GMAIL_APP_PASSWORD", "").strip()
          to = os.environ.get("ALERT_EMAIL_TO", "jroypeterson+alerts@gmail.com").strip()
          if not addr or not pw:
              print("email backup: GMAIL creds unset - skipping"); raise SystemExit(0)
          msg = MIMEText(os.environ.get("ALERT_BODY", "") or os.environ.get("ALERT_SUBJECT", ""), "plain")
          msg["Subject"] = os.environ.get("ALERT_SUBJECT", "[ClaudeFin] earnings_agent — alert")
          msg["From"] = addr; msg["To"] = to
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as s:
              s.login(addr, pw); s.send_message(msg)
          print(f"email backup: sent to {to}")
          PY

      # Reconcile TickTick tasks against DB truth: fix stale dates + titles on
      # confirmed rows, strip dates from unconfirmed rows (JP 2026-07-24: no
      # date in TickTick until company-confirmed/locked), mark reported names
      # [REPORTED], backfill lost task pointers. The create-only sync above
      # never edits an existing task, so a name whose projected date was wrong
      # (or whose pointer was lost on a date move) drifts and its task sits
      # open + stale forever (the UNH 2Q26 failure). Self-healing projection
      # of DB state with a built-in staleness guard (refuses on a stale DB).
      # Best-effort (TickTick hygiene, not a date-safeguard) so it can never fail
      # the critical sync.
      #
      # Writes ENABLED 2026-07-24 after the first-deploy dry-run CI logs
      # (2026-07-23/24) were reviewed and the bulk repair was applied + verified
      # from an operator session (ENSG est-marker case).
      - name: Reconcile TickTick tasks
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TICKTICK_ACCESS_TOKEN: ${{ secrets.TICKTICK_ACCESS_TOKEN }}
          COVERAGE_MANAGER_PATH: ${{ github.workspace }}/coverage-manager
        run: python main.py --reconcile-ticktick

      # Pre-earnings Consensus Metrics Preview (StreetAccount §9A) for upcoming
      # Tier-1 reporters -> #street-account + exports/consensus_preview.json
      # (hand-off for sa-monitor). A FEATURE, not a safeguard: continue-on-error
      # so a preview failure can NEVER fail the critical daily sync. Until the
      # SLACK_WEBHOOK_STREET_ACCOUNT secret is added it raises (swallowed here)
      # and posts nothing, but still writes the JSON export. Runs before the DB
      # save so its kv_store dedup marks persist.
      - name: Consensus metrics preview (StreetAccount §9A)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          COVERAGE_MANAGER_PATH: ${{ github.workspace }}/coverage-manager
          SLACK_WEBHOOK_STREET_ACCOUNT: ${{ secrets.SLACK_WEBHOOK_STREET_ACCOUNT }}
          # Second destination (JP, 2026-09-09): the same preview card also
          # goes to #portfolio, which is where he actually reads it. Each
          # destination keeps its own posted-ledger, so adding this cannot
          # disturb the #street-account lane. Without these two the portfolio
          # arm logs a loud SKIP and posts nothing.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_PORTFOLIO_CHANNEL_ID: ${{ secrets.SLACK_PORTFOLIO_CHANNEL_ID }}
        run: python main.py --consensus-preview

      # Publish exports/upcoming_events.json for downstream consumers
      # (sa-monitor Phase 2 'Note:' context enrichment fetches this via
      # raw.githubusercontent.com). Commit-back so the file is reachable
      # from a public URL without needing GH artifact auth.
      - name: Export upcoming events JSON
        if: github.ref == 'refs/heads/main'
        run: python scripts/export_upcoming_events.py

      # Rebuild the public earnings-calendar page (docs/index.html, served by
      # GitHub Pages from the docs/ folder on main -- the daily-reads pattern).
      # Regenerated from the DB every run so past/upcoming stay current; it is a
      # read-only consumer of earnings_events.db.
      - name: Build earnings calendar Pages site
        if: github.ref == 'refs/heads/main'
        run: python scripts/build_calendar_page.py

      # The portfolio season page (docs/season.html) — the browsable companion
      # to the Slack season card, where nothing is truncated and the reaction
      # columns sort. Publishes JP's Portfolio + Researching composition, which
      # he cleared 2026-08-09; share counts and cost basis are NOT on it.
      # NOT gating: a failure here must not cost the run its calendar page or
      # its exports commit-back.
      - name: Build portfolio season Pages site
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          COVERAGE_MANAGER_PATH: ${{ github.workspace }}/coverage-manager
        run: python scripts/build_season_page.py

      - name: Commit exports + Pages site if changed
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "earnings-agent-ci"
          git config user.email "earnings-agent-ci@users.noreply.github.com"
          git add exports/upcoming_events.json
          [ -f exports/consensus_preview.json ] && git add exports/consensus_preview.json || true
          [ -f docs/index.html ] && git add docs/index.html docs/.nojekyll || true
          [ -f docs/season.html ] && git add docs/season.html || true
          if git diff --cached --quiet; then
            echo "no changes to exported JSON or Pages site"
            exit 0
          fi
          # Commit FIRST, then rebase onto the moved remote, then push — the
          # sigma-alert-proven race guard. (The old order ran pull --rebase with
          # a STAGED index, which errors unconditionally and was swallowed by
          # '|| true', so on a remote race the commit-back was silently lost.)
          git commit -m "ci: refresh exports/*.json + docs/index.html (earnings calendar page)"
          git pull --rebase --quiet origin "${GITHUB_REF_NAME:-main}" || {
            git rebase --abort || true
            echo "::error::rebase onto origin failed - export commit-back NOT pushed"
            exit 1
          }
          git push "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME:-main}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Persist the SQLite DB for next run. Only main-branch runs upload —
      # otherwise a feature-branch test could leave a tainted artifact for
      # the next mainline restore to pick up.
      - name: Save earnings database
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: earnings-db
          path: earnings_events.db
          retention-days: 90
          overwrite: true

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_EARNINGS: ${{ secrets.SLACK_WEBHOOK_EARNINGS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK_EARNINGS" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              --data "{\"text\":\":rotating_light: *Daily Earnings Check* failed — <${RUN_URL}|run details>\"}" \
              "$SLACK_WEBHOOK_EARNINGS"
          fi

      # Out-of-band backup: also email, in case Slack itself is the failure.
      # Inline (runner python3 + stdlib) so it does NOT depend on the repo
      # checkout — the backup must work even if checkout is what failed.
      - name: Email backup on failure
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: jroypeterson+alerts@gmail.com
          ALERT_SUBJECT: "[ClaudeFin] earnings_agent — Daily Earnings Check failed"
          ALERT_BODY: "The Daily Earnings Check workflow failed (Slack alerting may be down). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          addr = os.environ.get("GMAIL_ADDRESS", "").strip()
          pw = os.environ.get("GMAIL_APP_PASSWORD", "").strip()
          to = os.environ.get("ALERT_EMAIL_TO", "jroypeterson+alerts@gmail.com").strip()
          if not addr or not pw:
              print("email backup: GMAIL creds unset - skipping"); raise SystemExit(0)
          msg = MIMEText(os.environ.get("ALERT_BODY", "") or os.environ.get("ALERT_SUBJECT", ""), "plain")
          msg["Subject"] = os.environ.get("ALERT_SUBJECT", "[ClaudeFin] earnings_agent — alert")
          msg["From"] = addr; msg["To"] = to
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as s:
              s.login(addr, pw); s.send_message(msg)
          print(f"email backup: sent to {to}")
          PY

      - name: Cleanup credentials
        if: always()
        run: rm -f credentials.json
